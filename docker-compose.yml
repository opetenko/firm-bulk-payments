x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://payments:payments@db:5432/payments

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot job: replicas starting together must not race on `alembic upgrade`.
  migrate:
    build: .
    environment: *app-env
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed"]
    depends_on:
      db:
        condition: service_healthy

  # Stateless replicas: correctness relies only on PostgreSQL row locks.
  app:
    build: .
    environment: *app-env
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.28.0-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      app:
        condition: service_healthy
