[project]
name = "firm-bulk-payments"
version = "0.1.0"
description = "Bulk payments between firms on the platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.7",
    "psycopg[binary]>=3",
    "pydantic>=2",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports/variables, undefined names
    "I",       # import sorting
    "B",       # bugbear: likely bugs (mutable defaults, loop closures, ...)
    "UP",      # pyupgrade: modern syntax for py313
    "ANN",     # every function parameter and return value must be annotated
    "N",       # pep8 naming
    "SIM",     # simplifications
    "PT",      # pytest style
    "RUF",     # ruff-specific
]
ignore = [
    "N818",    # domain errors are named as business facts (InsufficientFunds), not *Error
]

[tool.mypy]
python_version = "3.13"
strict = true               # no untyped defs, no implicit Any, no untyped calls
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "migrations", "tests"]
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["app", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95  # measured 97% at introduction; CI fails if coverage drops below

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
