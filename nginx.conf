# Round-robin over every `app` replica. Docker's DNS (127.0.0.11) returns one
# address per replica; `resolve` makes nginx query it at runtime and keep the
# list current. A plain `server app:8000;` resolves once through libc at startup,
# which may return a single address, sending all traffic to one replica.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream app {
    zone app 64k;
    server app:8000 resolve;
}

server {
    listen 80;

    # 1000 payments with 500-char descriptions stay well below 1 MB.
    client_max_body_size 1m;

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # nginx does not resend a POST to another replica after a failure
        # (no `non_idempotent` in proxy_next_upstream); clients retry with the
        # same Idempotency-Key instead.
    }
}
